name: bike_reclaim
description: BIKE LOOP — reporting and collection-route optimization for abandoned bicycles
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Backend (Supabase: Auth, PostgreSQL, Storage)
  # NOTE: uses an sb_publishable_ key, which requires a recent version
  supabase_flutter: ^2.9.0

  # Maps — Kakao Maps, via a WebView plugin around the JS SDK
  kakao_map_plugin: ^0.4.0

  # Device capabilities
  image_picker: ^1.1.2
  geolocator: ^13.0.1

  intl: ^0.19.0

  # Admin features: calling the optimization server and handing off to the Kakao Map app
  http: ^1.2.0
  url_launcher: ^6.3.0

  # Persisting the start and return point settings
  shared_preferences: ^2.3.0

  # Brand font (Varela Round, for the BIKE LOOP wordmark)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Generate app icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
